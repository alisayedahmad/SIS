seed: 2025
task: multi
num_classes: 3   # background, building, road
model:
  name: unet
  encoder: resnet50
  in_channels: 3
  decoder_channels: [256, 128, 64, 32, 16]
train:
  batch_size: 8
  max_epochs: 80
  lr: 2e-4
  weight_decay: 1e-4
  num_workers: 4
  precision: 16
  amp: true
  scheduler: onecycle
data:
  root: data/tiles/deepglobe
  size: 512
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  augment:
    hflip: true
    rotate: 20
    brightness: 0.1
    contrast: 0.1
loss: tversky
monitor: val_mIoU
