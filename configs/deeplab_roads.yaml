# Configuration pour DeepLabV3+ - Segmentation de routes
name: deeplab_roads_v2
seed: 1337
task: roads
num_classes: 2

model:
  name: deeplabv3plus
  backbone: resnet101  # resnet50, resnet101
  in_channels: 3
  output_stride: 16  # 8 ou 16
  pretrained: true

train:
  batch_size: 6
  max_epochs: 60
  lr: 2.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: onecycle
  num_workers: 4
  precision: "16-mixed"
  amp: true
  gradient_clip_val: 1.0
  use_ema: true
  ema_decay: 0.999
  early_stopping: true
  early_stopping_patience: 15

data:
  root: data/tiles/spacenet3
  size: 512
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  
  augment:
    hflip: true
    rotate: 10
    brightness: 0.1
    contrast: 0.1
    blur: true

loss: focal_dice

metrics:
  monitor: val_mIoU
  compute_apls: true  # Important pour les routes

logging:
  type: tensorboard
  project: sat-segmentation

checkpoint:
  dirpath: checkpoints/deeplab_roads
  save_top_k: 3