name: unet_inria_buildings
seed: 42
task: buildings
num_classes: 2

model:
  name: unet
  encoder: resnet34
  in_channels: 3
  decoder_channels: [256, 128, 64, 32, 16]
  use_attention: false
  dropout: 0.1
  pretrained: true

train:
  batch_size: 8        # Réduire à 4 si OOM GPU (< 8 GB VRAM)
  max_epochs: 50
  lr: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: onecycle
  num_workers: 4       # Mettre 0 sur Windows si problèmes multiprocessing
  precision: "16-mixed"  # Mettre "32-true" si le GPU ne supporte pas fp16
  use_ema: true
  early_stopping: true
  early_stopping_patience: 10

data:
  root: data/tiles/inria   # Dossier de sortie du script prepare_inria.py
  size: 512
  # Statistiques ImageNet (bonnes valeurs par défaut pour images aériennes RGB, mais on peut recalculer sur le dataset)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augment:
    hflip: true
    vflip: true      # Images aériennes : la symétrie verticale est valide
    rotate: 90       # Rotation jusqu'à 90° (bâtiments sans orientation préférentielle)
    brightness: 0.2
    contrast: 0.2

loss: bce_dice

metrics:
  monitor: val_mIoU
  compute_apls: false

logging:
  type: tensorboard
  project: sat-segmentation

checkpoint:
  dirpath: checkpoints/unet_inria
  save_top_k: 3
